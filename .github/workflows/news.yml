name: News Calendar

on:
  schedule:
    # twice a day, every day: 00:05 and 12:05 UTC (the new week appears over the weekend)
    - cron: "5 0,12 * * *"
  workflow_dispatch:   # "Run workflow" button for a manual run

permissions:
  contents: write

concurrency:
  group: publish-docs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build this week's calendar
        env:
          GAMMA_OUT_DIR: docs
        run: python news_extract.py

      - name: Publish to the page
        run: |
          git config user.name "news-calendar-bot"
          git config user.email "news-calendar-bot@users.noreply.github.com"
          git add docs/news
          git diff --cached --quiet && exit 0
          git commit -m "News calendar $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
